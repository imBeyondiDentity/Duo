<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'> <rect width='100' height='100' rx='20' fill='%230e0d0c'/> <circle cx='50' cy='34' r='17' fill='none' stroke='%23ff6a1a' stroke-width='6'/> <circle cx='35' cy='60' r='17' fill='none' stroke='%23ff6a1a' stroke-width='6'/> <circle cx='65' cy='60' r='17' fill='none' stroke='%23ff6a1a' stroke-width='6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0c; --panel:#171513; --line:#2c2824; --text:#ece6de;
  --muted:#8f877d; --accent:#ff6a1a; --accent-dim:#5a2a10;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%}
body{font-family:var(--mono);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:88px 20px 64px;position:relative}

.lang{position:absolute;top:48px;right:20px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.kicker{display:block;text-align:center;color:var(--accent);font-size:12px;letter-spacing:.18em;margin-bottom:18px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(56px,14vw,92px);line-height:.9;margin:0;letter-spacing:-.02em;text-align:center}
.lede{color:var(--muted);text-align:center;max-width:42ch;margin:16px auto 44px}

.cards{display:grid;grid-auto-rows:1fr;gap:16px}
.card{display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;padding:26px 24px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
.card:hover,.card:focus-visible{border-color:var(--accent);background:#1a1411}
.card b{font-family:var(--serif);font-weight:900;color:var(--accent);font-size:20px;font-style:normal}
.card span{color:var(--muted)}

.more{margin-top:40px;text-align:center}
.more-label{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:9px 18px;text-decoration:none;color:var(--accent);font-size:13px;transition:border-color .15s,background .15s}
.chip:hover,.chip:focus-visible{border-color:var(--accent);background:#1a1411}
.chip i{font-style:normal;font-size:12px}

footer{margin-top:48px;text-align:center;color:var(--muted);font-size:12px}
footer i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;font-style:normal}

button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:520px){ main{padding-top:76px} .lang{top:20px} }
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ru" aria-pressed="true">RU</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>

  <span class="kicker" data-i18n="kicker"></span>
  <h1>Trio</h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="cards">
    <a class="card" href="peel.html">
      <div><b>Peel</b> <span data-i18n="peel"></span></div>
    </a>
    <a class="card" href="monologue.html">
      <div><b>Monologue</b> <span data-i18n="mono"></span></div>
    </a>
    <a class="card" href="cover.html">
      <div><b>Cover</b> <span data-i18n="cover"></span></div>
    </a>
  </div>

  <div class="more">
    <span class="more-label" data-i18n="moreLabel"></span>
    <div class="chips">
      <a class="chip" href="https://imbeyondidentity.github.io/airband/" target="_blank" rel="noopener">Airband <i>↗</i></a>
      <a class="chip" href="https://imbeyondidentity.github.io/identity-prompt-engine/" target="_blank" rel="noopener">Music DNA <i>↗</i></a>
    </div>
  </div>

  <footer><i></i>Trio</footer>
</main>

<script>
const T = {
  ru: {
    kicker: "НАБОР ДЛЯ АУДИО",
    lede: "Три маленьких инструмента для звука. Ничего никуда не загружается — всё работает прямо в браузере.",
    peel: "— достаёт звук из видео и сохраняет в MP3 или WAV",
    mono: "— превращает пение в речь тем же голосом",
    cover: "— вшивает обложку в MP3 или WAV",
    moreLabel: "Другие проекты"
  },
  en: {
    kicker: "AUDIO TOOLKIT",
    lede: "Three small audio tools. Nothing is uploaded anywhere — everything runs right in your browser.",
    peel: "— pulls the sound out of a video and saves it as MP3 or WAV",
    mono: "— turns singing into speech, same voice",
    cover: "— embeds cover art into MP3 or WAV",
    moreLabel: "Other projects"
  }
};
let lang = (navigator.language || "ru").startsWith("ru") ? "ru" : "en";
function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; apply(); });
apply();
</script>
</body>
</html>
