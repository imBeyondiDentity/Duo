<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monologue</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#141416;
    --panel-2:#1b1b1e;
    --line:#2b2a28;
    --ink:#ece7de;
    --ink-dim:#8d887f;
    --accent:#c9622f;
    --accent-soft:rgba(201,98,47,.06);
    --accent-fill:#3a2015;
    --serif:'Playfair Display', ui-serif, Georgia, serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); font-size:14px; line-height:1.6;
    min-height:100vh;
  }
  a{color:var(--accent)}
  .wrap{max-width:720px; margin:0 auto; padding:32px 24px 72px;}

  /* language toggle */
  .langrow{ display:flex; justify-content:flex-end; margin-bottom:52px; }
  .langtoggle{
    display:inline-flex; border:1px solid var(--line); border-radius:999px;
    overflow:hidden; background:var(--panel);
  }
  .langbtn{
    font-family:var(--mono); font-size:13px; letter-spacing:.03em;
    padding:9px 20px; background:transparent; border:none; color:var(--ink-dim);
    cursor:pointer;
  }
  .langbtn:first-child{ border-right:1px solid var(--line); }
  .langbtn.active{ background:var(--accent-fill); color:var(--ink); }

  /* hero */
  h1.hero{
    font-family:var(--serif); font-weight:700; letter-spacing:-.01em;
    font-size:clamp(46px, 15vw, 80px); line-height:1; text-align:center;
    margin:0 0 26px;
  }
  .lede{
    text-align:center; color:var(--ink-dim); max-width:48ch;
    margin:0 auto 52px;
  }

  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; margin-bottom:18px;
  }
  .label{ font-size:11px; letter-spacing:.06em; color:var(--ink-dim); display:block; margin-bottom:8px; }

  /* dropzone, matching the Peel reference */
  #dropzone{
    border:1.5px dashed var(--accent); border-radius:18px;
    background:var(--accent-soft);
    padding:64px 24px; text-align:center; cursor:pointer;
    transition:background .15s ease;
  }
  #dropzone:hover, #dropzone.drag{ background:rgba(201,98,47,.1); }
  #dropzone .dz-primary{
    font-family:var(--serif); font-weight:600; color:var(--ink);
    font-size:clamp(24px, 6.5vw, 32px); margin-bottom:12px;
  }
  #dropzone .dz-secondary{ font-size:12.5px; color:var(--ink-dim); }
  #fileInput{ display:none; }
  #fileMeta{ margin-top:14px; font-size:12px; color:var(--ink-dim); display:none; text-align:center; }

  /* mode tabs */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{
    flex:1; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; cursor:pointer; color:var(--ink-dim);
  }
  .tab .t1{ font-family:var(--mono); font-size:11px; letter-spacing:.05em; }
  .tab .t2{ font-family:var(--serif); font-weight:600; font-size:18px; color:var(--ink); margin-top:2px; }
  .tab.active{ border-color:var(--accent); background:var(--panel-2); }
  .tab.active .t1{ color:var(--accent); }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .row:last-child{ margin-bottom:0; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .slider-row{ margin-bottom:16px; }
  .slider-row:last-child{ margin-bottom:0; }
  .slider-row .top{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-bottom:6px; }
  .slider-row .val{ color:var(--ink); font-variant-numeric:tabular-nums; }

  input[type=text], input[type=password], textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-family:var(--mono); font-size:13px; padding:10px 12px;
  }
  textarea{ resize:vertical; min-height:70px; }
  label.check{ display:flex; align-items:center; gap:8px; color:var(--ink-dim); font-size:12px; }

  button{
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    border-radius:8px; border:1px solid var(--line); cursor:pointer;
    background:var(--panel-2); color:var(--ink); padding:11px 18px;
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#160b06; font-weight:500; }
  button.primary:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.4; cursor:default; }
  button:disabled:hover{ border-color:var(--line); filter:none; }

  #status{ font-size:12px; color:var(--ink-dim); margin-top:14px; min-height:1.4em; }
  #status.err{ color:var(--accent); }

  .result{ display:none; }
  canvas{ width:100%; height:70px; display:block; border-radius:8px; background:var(--bg); }
  .wave-label{ font-size:11px; color:var(--ink-dim); margin:14px 0 6px; }
  audio{ width:100%; margin-top:6px; }
  .download-row{ margin-top:20px; display:flex; gap:10px; }

  .hint{ font-size:12px; color:var(--ink-dim); margin-top:14px; }
  .hint code{ background:var(--bg); border:1px solid var(--line); padding:1px 5px; border-radius:4px; }

  .divider{ border:none; border-top:1px solid var(--line); margin:48px 0 26px; }
  footer{ font-size:13px; color:var(--ink-dim); line-height:1.75; }
  footer code{ background:var(--panel); border:1px solid var(--line); padding:1px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="langrow">
    <div class="langtoggle">
      <button class="langbtn" data-lang="ru">RU</button>
      <button class="langbtn" data-lang="en">EN</button>
    </div>
  </div>

  <h1 class="hero">Monologue</h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="panel" style="padding:0; background:transparent; border:none;">
    <div id="dropzone">
      <div class="dz-primary" data-i18n="dzPrimary"></div>
      <div class="dz-secondary" data-i18n="dzSecondary"></div>
      <input id="fileInput" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.aac,.ogg,.aiff,.wma">
    </div>
    <div id="fileMeta"></div>
  </div>

  <div id="modeSection" style="display:none; margin-top:20px">

    <div class="tabs">
      <div class="tab active" id="tabDsp">
        <div class="t1" data-i18n="tab1Kicker"></div>
        <div class="t2" data-i18n="tab1Title"></div>
      </div>
      <div class="tab" id="tabAi">
        <div class="t1" data-i18n="tab2Kicker"></div>
        <div class="t2" data-i18n="tab2Title"></div>
      </div>
    </div>

    <!-- DSP PANEL -->
    <div class="panel" id="dspPanel">
      <div class="slider-row">
        <div class="top"><span data-i18n="lblFlatten"></span><span class="val" id="vFlatten">0.75</span></div>
        <input type="range" id="flatten" min="0" max="1" step="0.05" value="0.75">
      </div>
      <div class="slider-row">
        <div class="top"><span data-i18n="lblVibrato"></span><span class="val" id="vVibrato">4.5</span></div>
        <input type="range" id="vibrato" min="1" max="10" step="0.5" value="4.5">
      </div>
      <div class="slider-row">
        <div class="top"><span data-i18n="lblSustain"></span><span class="val" id="vSustain">180</span></div>
        <input type="range" id="sustain" min="80" max="400" step="10" value="180">
      </div>
      <div class="slider-row">
        <div class="top"><span data-i18n="lblTrigger"></span><span class="val" id="vTrigger">320</span></div>
        <input type="range" id="trigger" min="150" max="800" step="10" value="320">
      </div>
      <div class="row" style="margin-top:22px">
        <button class="primary" id="runDsp" data-i18n="btnConvert"></button>
        <span class="hint" style="margin:0" data-i18n="hintNothingLeaves"></span>
      </div>
    </div>

    <!-- AI PANEL -->
    <div class="panel" id="aiPanel" style="display:none">
      <div class="label" data-i18n="lblApiKey"></div>
      <input type="password" id="apiKey" placeholder="sk_...">
      <label class="check" style="margin-top:8px">
        <input type="checkbox" id="rememberKey"> <span data-i18n="chkRemember"></span>
      </label>

      <div class="row" style="margin-top:20px; align-items:flex-start">
        <button id="transcribeBtn" data-i18n="btnTranscribe"></button>
        <span class="hint" style="margin:0" data-i18n="hintScribeCost"></span>
      </div>

      <div id="transcriptBlock" style="display:none; margin-top:16px">
        <div class="label" data-i18n="lblTranscript"></div>
        <textarea id="transcript"></textarea>
        <div class="row" style="margin-top:16px">
          <label class="check">
            <input type="checkbox" id="keepVoice"> <span data-i18n="chkKeepVoice"></span>
          </label>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="primary" id="runAi" data-i18n="btnSpeak"></button>
        </div>
      </div>
    </div>

    <div id="status"></div>

    <div class="panel result" id="resultPanel">
      <div class="wave-label" data-i18n="lblOriginal"></div>
      <canvas id="waveOrig"></canvas>
      <audio id="audioOrig" controls></audio>

      <div class="wave-label" style="margin-top:22px" data-i18n="lblConverted"></div>
      <canvas id="waveOut"></canvas>
      <audio id="audioOut" controls></audio>

      <div class="download-row">
        <a id="downloadLink" download="monologue.wav"><button class="primary" data-i18n="btnDownload"></button></a>
      </div>
    </div>

    <p class="hint" id="dspCaveat" data-i18n="dspCaveat"></p>

  </div>

  <hr class="divider">
  <footer data-i18n="footer"></footer>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // i18n
  // ---------------------------------------------------------------------
  const STR = {
    en: {
      lede: "Upload a solo vocal — a cappella, no music underneath — and get the same voice reading the words instead of singing them. Two ways to do it: signal processing, which reshapes the take itself and runs entirely offline, or voice cloning, which transcribes it and speaks the words back in a clone of the same voice.",
      dzPrimary: "Drop a solo vocal here",
      dzSecondary: "or click to choose · wav, mp3, flac, m4a",
      tab1Kicker: "OFFLINE", tab1Title: "Signal",
      tab2Kicker: "CLOUD · ELEVENLABS", tab2Title: "Clone",
      lblFlatten: "Flatten melody", lblVibrato: "Vibrato cutoff (Hz)",
      lblSustain: "Held-note length (ms)", lblTrigger: "Compress notes held longer than (ms)",
      btnConvert: "Convert", hintNothingLeaves: "Nothing leaves your browser.",
      lblApiKey: "ELEVENLABS API KEY", chkRemember: "remember this key in this browser only",
      btnTranscribe: "1 · Transcribe", hintScribeCost: "Uses ElevenLabs Scribe — costs a few cents per minute.",
      lblTranscript: "TRANSCRIPT — fix anything Scribe misheard",
      chkKeepVoice: "keep the cloned voice in my ElevenLabs account after",
      btnSpeak: "2 · Speak it back",
      lblOriginal: "ORIGINAL", lblConverted: "CONVERTED", btnDownload: "Download WAV",
      dspCaveat: "The signal path is a simplified pitch-shift, good for typical singing ranges. Wide leaps or belted high notes can sound a little \u201cchipmunked\u201d — for cleaner results on those, run the same file through monologue.py dsp in the companion CLI, which uses the WORLD vocoder instead.",
      footer: "Files are processed locally and never leave your device — except in Clone mode, which calls the ElevenLabs API directly from your browser. For batch jobs there's a CLI: monologue.py in the repo.",
      statusDecoding: "Decoding audio…", statusAnalyzing: "Analyzing pitch…", statusDone: "Done.",
      statusErrorConvert: "Something went wrong converting that file: ",
      statusNeedKey: "Paste your ElevenLabs API key first.",
      statusUploadingTranscribe: "Uploading for transcription…",
      statusTranscribed: "Transcribed — check the text below, then speak it back.",
      statusTranscribeFailed: "Transcription failed: ",
      statusNeedKeyAndText: "Need both an API key and a transcript.",
      statusCloning: "Cloning the voice…", statusSpeaking: "Speaking it back…",
    },
    ru: {
      lede: "Загрузи сольный вокал — акапелла, без музыки — и получи тот же голос, читающий текст вместо пения. Два способа: обработка сигнала — меняет саму запись и работает полностью офлайн, либо клонирование голоса — распознаёт текст и озвучивает его клоном того же голоса.",
      dzPrimary: "Перетащи вокал сюда",
      dzSecondary: "или нажми, чтобы выбрать файл · wav, mp3, flac, m4a",
      tab1Kicker: "ОФЛАЙН", tab1Title: "Сигнал",
      tab2Kicker: "ОБЛАКО · ELEVENLABS", tab2Title: "Клон",
      lblFlatten: "Сгладить мелодию", lblVibrato: "Срез вибрато (Гц)",
      lblSustain: "Длина выдержанной ноты (мс)", lblTrigger: "Сжимать ноты длиннее (мс)",
      btnConvert: "Конвертировать", hintNothingLeaves: "Ничего не покидает браузер.",
      lblApiKey: "API-КЛЮЧ ELEVENLABS", chkRemember: "запомнить ключ только в этом браузере",
      btnTranscribe: "1 · Распознать", hintScribeCost: "Использует ElevenLabs Scribe — пару центов за минуту.",
      lblTranscript: "ТЕКСТ — поправь, если Scribe что-то расслышал неверно",
      chkKeepVoice: "оставить клон голоса в аккаунте ElevenLabs после",
      btnSpeak: "2 · Озвучить",
      lblOriginal: "ОРИГИНАЛ", lblConverted: "РЕЗУЛЬТАТ", btnDownload: "Скачать WAV",
      dspCaveat: "Сигнальный режим — упрощённый питч-шифт, хорошо работает на типичном вокальном диапазоне. Широкие скачки или высокие ноты на крике могут звучать слегка «бурундуком» — для чистого результата прогони тот же файл через monologue.py dsp в CLI, там используется WORLD-вокодер.",
      footer: "Файлы обрабатываются локально и никуда не уходят — кроме режима «Клон», который напрямую обращается к API ElevenLabs из браузера. Для пакетной обработки есть CLI: monologue.py в репозитории.",
      statusDecoding: "Декодирую аудио…", statusAnalyzing: "Анализирую высоту тона…", statusDone: "Готово.",
      statusErrorConvert: "Не получилось сконвертировать файл: ",
      statusNeedKey: "Сначала вставь API-ключ ElevenLabs.",
      statusUploadingTranscribe: "Загружаю для распознавания…",
      statusTranscribed: "Распознано — проверь текст ниже, потом озвучь его.",
      statusTranscribeFailed: "Распознавание не удалось: ",
      statusNeedKeyAndText: "Нужен и ключ, и текст.",
      statusCloning: "Клонирую голос…", statusSpeaking: "Озвучиваю…",
    },
  };

  let lang = localStorage.getItem("monologue_lang") || "ru";
  const t = (key) => STR[lang][key] ?? key;

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll(".langbtn").forEach((b) => { b.classList.toggle("active", b.dataset.lang === lang); });
  }
  document.querySelectorAll(".langbtn").forEach((b) => {
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      localStorage.setItem("monologue_lang", lang);
      applyLang();
    });
  });
  applyLang();

  // ---------------------------------------------------------------------
  // state
  // ---------------------------------------------------------------------
  let audioCtx = null;
  let originalMono = null;     // Float32Array
  let originalSr = 0;
  let mode = "dsp";

  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------------
  // file loading
  // ---------------------------------------------------------------------
  const dropzone = $("dropzone");
  const fileInput = $("fileInput");

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  async function loadFile(file) {
    setStatus(t("statusDecoding"));
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuf = await file.arrayBuffer();
    const buf = await audioCtx.decodeAudioData(arrayBuf.slice(0));
    originalSr = buf.sampleRate;
    originalMono = mixToMono(buf);

    $("fileMeta").style.display = "block";
    $("fileMeta").textContent = `${file.name} · ${buf.duration.toFixed(1)}s · ${buf.sampleRate} Hz`;
    $("modeSection").style.display = "block";
    $("resultPanel").style.display = "none";
    setStatus("");

    const key = localStorage.getItem("monologue_key");
    if (key) { $("apiKey").value = key; $("rememberKey").checked = true; }
  }

  function mixToMono(buf) {
    if (buf.numberOfChannels === 1) return buf.getChannelData(0).slice();
    const n = buf.length;
    const out = new Float32Array(n);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < n; i++) out[i] += ch[i] / buf.numberOfChannels;
    }
    return out;
  }

  // ---------------------------------------------------------------------
  // mode tabs
  // ---------------------------------------------------------------------
  $("tabDsp").addEventListener("click", () => setMode("dsp"));
  $("tabAi").addEventListener("click", () => setMode("ai"));
  function setMode(m) {
    mode = m;
    $("tabDsp").classList.toggle("active", m === "dsp");
    $("tabAi").classList.toggle("active", m === "ai");
    $("dspPanel").style.display = m === "dsp" ? "block" : "none";
    $("aiPanel").style.display = m === "ai" ? "block" : "none";
    $("dspCaveat").style.display = m === "dsp" ? "block" : "none";
  }

  // ---------------------------------------------------------------------
  // sliders
  // ---------------------------------------------------------------------
  const sliderPairs = [
    ["flatten", "vFlatten"], ["vibrato", "vVibrato"],
    ["sustain", "vSustain"], ["trigger", "vTrigger"],
  ];
  for (const [id, out] of sliderPairs) {
    $(id).addEventListener("input", () => { $(out).textContent = $(id).value; });
  }

  function setStatus(msg, isErr) {
    const el = $("status");
    el.textContent = msg;
    el.classList.toggle("err", !!isErr);
  }

  // =======================================================================
  // DSP MODE — pitch flatten + vibrato removal + sustain compression
  // =======================================================================

  const FRAME = 2048;
  const HOP = FRAME / 4;
  const MIN_F0 = 70, MAX_F0 = 500;
  const DECIMATION = 10;

  function hann(n) {
    const w = new Float32Array(n);
    for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
    return w;
  }

  function decimate(x, factor) {
    const n = Math.floor(x.length / factor);
    const y = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      const start = i * factor;
      for (let k = 0; k < factor; k++) s += x[start + k] || 0;
      y[i] = s / factor;
    }
    return y;
  }

  function autocorrPitch(seg, sr, minLag, maxLag) {
    let e0 = 0;
    for (let i = 0; i < seg.length; i++) e0 += seg[i] * seg[i];
    const rms = Math.sqrt(e0 / seg.length);
    if (rms < 0.004 || e0 < 1e-8) return { f0: 0, voiced: false };

    let bestLag = -1, bestVal = 0;
    const hi = Math.min(maxLag, seg.length - 2);
    for (let lag = minLag; lag <= hi; lag++) {
      let sum = 0;
      for (let i = 0; i < seg.length - lag; i++) sum += seg[i] * seg[i + lag];
      const norm = sum / e0;
      if (norm > bestVal) { bestVal = norm; bestLag = lag; }
    }
    if (bestLag < 0 || bestVal < 0.3) return { f0: 0, voiced: false };

    const acAt = (lag) => {
      let s = 0;
      for (let i = 0; i < seg.length - lag; i++) s += seg[i] * seg[i + lag];
      return s;
    };
    const l = Math.max(minLag, bestLag - 1), r = Math.min(hi, bestLag + 1);
    const yL = acAt(l), yC = acAt(bestLag), yR = acAt(r);
    const denom = yL - 2 * yC + yR;
    const shift = denom !== 0 ? 0.5 * (yL - yR) / denom : 0;
    const refined = Math.max(1, bestLag + shift);
    return { f0: sr / refined, voiced: true };
  }

  function analyzePitch(mono, sr) {
    const decim = decimate(mono, DECIMATION);
    const decimSr = sr / DECIMATION;
    const minLag = Math.max(1, Math.floor(decimSr / MAX_F0));
    const maxLag = Math.ceil(decimSr / MIN_F0);
    const winDecimLen = Math.max(minLag * 2 + 8, Math.round(FRAME / DECIMATION));

    const numFrames = Math.max(0, Math.floor((mono.length - FRAME) / HOP) + 1);
    const f0 = new Float32Array(numFrames);
    const voiced = new Uint8Array(numFrames);

    for (let i = 0; i < numFrames; i++) {
      const centerOrig = i * HOP + FRAME / 2;
      const centerDecim = Math.round(centerOrig / DECIMATION);
      const half = Math.round(winDecimLen / 2);
      const start = Math.max(0, centerDecim - half);
      const end = Math.min(decim.length, centerDecim + half);
      const seg = decim.subarray(start, end);
      const { f0: est, voiced: v } = autocorrPitch(seg, decimSr, minLag, maxLag);
      f0[i] = est;
      voiced[i] = v ? 1 : 0;
    }
    return { f0, voiced, numFrames, frameRate: sr / HOP };
  }

  function gaussianKernel(sigma) {
    const radius = Math.max(1, Math.ceil(sigma * 3));
    const k = new Float32Array(radius * 2 + 1);
    let sum = 0;
    for (let i = -radius; i <= radius; i++) {
      const v = Math.exp(-(i * i) / (2 * sigma * sigma));
      k[i + radius] = v; sum += v;
    }
    for (let i = 0; i < k.length; i++) k[i] /= sum;
    return k;
  }

  function smoothArray(arr, kernel) {
    const r = (kernel.length - 1) / 2;
    const out = new Float32Array(arr.length);
    for (let i = 0; i < arr.length; i++) {
      let s = 0;
      for (let j = -r; j <= r; j++) {
        const idx = Math.min(arr.length - 1, Math.max(0, i + j));
        s += arr[idx] * kernel[j + r];
      }
      out[i] = s;
    }
    return out;
  }

  function flattenPitch(f0, voiced, frameRate, vibratoCutoffHz, flatten) {
    const n = f0.length;
    const anyVoiced = voiced.some((v) => v);
    if (!anyVoiced) return f0.slice();

    const raw = new Float32Array(n);
    for (let i = 0; i < n; i++) raw[i] = voiced[i] ? Math.log2(f0[i]) : NaN;

    const filled = raw.slice();
    let i = 0;
    while (i < n && Number.isNaN(filled[i])) i++;
    for (let k = 0; k < i; k++) filled[k] = filled[i];
    let prev = i;
    for (let j = i + 1; j < n; j++) {
      if (!Number.isNaN(filled[j])) {
        if (j > prev + 1) {
          for (let k = prev + 1; k < j; k++) {
            const tt = (k - prev) / (j - prev);
            filled[k] = filled[prev] * (1 - tt) + filled[j] * tt;
          }
        }
        prev = j;
      }
    }
    for (let k = prev + 1; k < n; k++) filled[k] = filled[prev];

    const sigmaFrames = Math.max(1, frameRate / (2 * Math.PI * vibratoCutoffHz));
    const smooth = smoothArray(filled, gaussianKernel(sigmaFrames));

    const flat = smooth.slice();
    let p = 0;
    while (p < n) {
      if (voiced[p]) {
        let q = p;
        while (q < n && voiced[q]) q++;
        const seg = Array.from(smooth.slice(p, q)).sort((a, b) => a - b);
        const med = seg[Math.floor(seg.length / 2)];
        for (let k = p; k < q; k++) flat[k] = smooth[k] + (med - smooth[k]) * flatten;
        p = q;
      } else p++;
    }

    const target = new Float32Array(n);
    for (let k = 0; k < n; k++) target[k] = voiced[k] ? Math.pow(2, flat[k]) : 0;
    return target;
  }

  function resynthesize(mono, f0, voiced, targetF0, numFrames) {
    const win = hann(FRAME);
    const out = new Float32Array(mono.length + FRAME);
    const wsum = new Float32Array(mono.length + FRAME);

    for (let i = 0; i < numFrames; i++) {
      const start = i * HOP;
      if (!voiced[i] || f0[i] <= 0 || targetF0[i] <= 0) {
        for (let k = 0; k < FRAME; k++) {
          const s = start + k;
          if (s < mono.length) { out[s] += mono[s] * win[k]; wsum[s] += win[k]; }
        }
        continue;
      }
      const ratio = Math.min(2.0, Math.max(0.5, targetF0[i] / f0[i]));
      for (let k = 0; k < FRAME; k++) {
        const srcPos = start + k * ratio;
        const s0 = Math.floor(srcPos), s1 = s0 + 1, frac = srcPos - s0;
        const x0 = (s0 >= 0 && s0 < mono.length) ? mono[s0] : 0;
        const x1 = (s1 >= 0 && s1 < mono.length) ? mono[s1] : 0;
        const sample = x0 * (1 - frac) + x1 * frac;
        const outIdx = start + k;
        if (outIdx < out.length) { out[outIdx] += sample * win[k]; wsum[outIdx] += win[k]; }
      }
    }
    for (let i = 0; i < out.length; i++) if (wsum[i] > 1e-6) out[i] /= wsum[i];
    return out.subarray(0, mono.length);
  }

  function spliceOutRegions(y, cuts, fadeLen) {
    if (!cuts.length) return y;
    const segments = [];
    let cursor = 0;
    for (const [cs, ce] of cuts) {
      const fs = Math.max(cursor, cs - fadeLen);
      const actualFade = Math.max(0, Math.min(fadeLen, cs - fs, y.length - ce));
      segments.push(y.subarray(cursor, fs));
      const blend = new Float32Array(actualFade);
      for (let k = 0; k < actualFade; k++) {
        const tt = actualFade > 1 ? k / (actualFade - 1) : 0;
        blend[k] = (y[fs + k] ?? 0) * (1 - tt) + (y[ce + k] ?? 0) * tt;
      }
      segments.push(blend);
      cursor = ce + actualFade;
    }
    segments.push(y.subarray(cursor));
    const total = segments.reduce((s, a) => s + a.length, 0);
    const out = new Float32Array(total);
    let off = 0;
    for (const seg of segments) { out.set(seg, off); off += seg.length; }
    return out;
  }

  function findSustainCuts(f0, voiced, frameRate, sustainMs, triggerMs) {
    const triggerFrames = Math.round((triggerMs / 1000) * frameRate);
    const targetFrames = Math.max(1, Math.round((sustainMs / 1000) * frameRate));
    const cuts = [];
    let i = 0, n = voiced.length;
    while (i < n) {
      if (voiced[i]) {
        let j = i;
        while (j < n && voiced[j]) j++;
        const length = j - i;
        if (length > triggerFrames) {
          const seg = Array.from(f0.slice(i, j)).filter((v) => v > 0);
          if (seg.length) {
            const med = seg.slice().sort((a, b) => a - b)[Math.floor(seg.length / 2)];
            const cents = seg.map((v) => 1200 * Math.log2(v / med));
            const std = Math.sqrt(cents.reduce((s, v) => s + v * v, 0) / cents.length);
            const nDropFrames = length - targetFrames;
            if (std <= 80 && nDropFrames > 0) {
              const cutStart = i + Math.floor((length - nDropFrames) / 2);
              const cutEnd = cutStart + nDropFrames;
              cuts.push([cutStart * HOP, cutEnd * HOP]);
            }
          }
        }
        i = j;
      } else i++;
    }
    return cuts;
  }

  function dspConvert(mono, sr, opts) {
    const { f0, voiced, numFrames, frameRate } = analyzePitch(mono, sr);
    const target = flattenPitch(f0, voiced, frameRate, opts.vibratoCutoff, opts.flatten);
    let y = resynthesize(mono, f0, voiced, target, numFrames);
    // held-note detection must run on the RAW pitch, not the flattened one —
    // flattening already squashes cents-variance toward 0, so checking the
    // flattened contour here made almost every phrase look "held" and got
    // it wrongly time-compressed.
    const cuts = findSustainCuts(f0, voiced, frameRate, opts.sustainMs, opts.triggerMs);
    y = spliceOutRegions(y, cuts, Math.round(0.02 * sr));
    return y;
  }

  $("runDsp").addEventListener("click", async () => {
    if (!originalMono) return;
    $("runDsp").disabled = true;
    setStatus(t("statusAnalyzing"));
    await new Promise((r) => setTimeout(r, 30));
    try {
      const opts = {
        flatten: parseFloat($("flatten").value),
        vibratoCutoff: parseFloat($("vibrato").value),
        sustainMs: parseFloat($("sustain").value),
        triggerMs: parseFloat($("trigger").value),
      };
      const y = dspConvert(originalMono, originalSr, opts);
      setStatus(t("statusDone"));
      showResult(y, originalSr);
    } catch (e) {
      console.error(e);
      setStatus(t("statusErrorConvert") + e.message, true);
    } finally {
      $("runDsp").disabled = false;
    }
  });

  // =======================================================================
  // AI MODE — ElevenLabs Scribe (transcribe) + instant voice clone (speak)
  // =======================================================================

  $("rememberKey").addEventListener("change", () => {
    if ($("rememberKey").checked) localStorage.setItem("monologue_key", $("apiKey").value);
    else localStorage.removeItem("monologue_key");
  });
  $("apiKey").addEventListener("input", () => {
    if ($("rememberKey").checked) localStorage.setItem("monologue_key", $("apiKey").value);
  });

  $("transcribeBtn").addEventListener("click", async () => {
    if (!originalMono) return;
    const key = $("apiKey").value.trim();
    if (!key) { setStatus(t("statusNeedKey"), true); return; }
    $("transcribeBtn").disabled = true;
    setStatus(t("statusUploadingTranscribe"));
    try {
      const blob = encodeWav(originalMono, originalSr);
      const form = new FormData();
      form.append("file", blob, "vocal.wav");
      form.append("model_id", "scribe_v2");
      const res = await fetch("https://api.elevenlabs.io/v1/speech-to-text", {
        method: "POST", headers: { "xi-api-key": key }, body: form,
      });
      if (!res.ok) throw new Error(`ElevenLabs said ${res.status}: ${await res.text()}`);
      const data = await res.json();
      $("transcript").value = data.text || "";
      $("transcriptBlock").style.display = "block";
      setStatus(t("statusTranscribed"));
    } catch (e) {
      console.error(e);
      setStatus(t("statusTranscribeFailed") + e.message, true);
    } finally {
      $("transcribeBtn").disabled = false;
    }
  });

  $("runAi").addEventListener("click", async () => {
    const key = $("apiKey").value.trim();
    const text = $("transcript").value.trim();
    if (!key || !text) { setStatus(t("statusNeedKeyAndText"), true); return; }
    $("runAi").disabled = true;
    setStatus(t("statusCloning"));
    let voiceId = null;
    try {
      const sampleBlob = encodeWav(originalMono, originalSr);
      const cloneForm = new FormData();
      cloneForm.append("name", "monologue-temp-" + Date.now());
      cloneForm.append("files", sampleBlob, "sample.wav");
      const cloneRes = await fetch("https://api.elevenlabs.io/v1/voices/add", {
        method: "POST", headers: { "xi-api-key": key }, body: cloneForm,
      });
      if (!cloneRes.ok) throw new Error(`voice clone failed (${cloneRes.status}): ${await cloneRes.text()}`);
      const cloneData = await cloneRes.json();
      voiceId = cloneData.voice_id;

      setStatus(t("statusSpeaking"));
      const ttsRes = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: "POST",
        headers: { "xi-api-key": key, "Content-Type": "application/json" },
        body: JSON.stringify({ text, model_id: "eleven_multilingual_v2" }),
      });
      if (!ttsRes.ok) throw new Error(`speech generation failed (${ttsRes.status}): ${await ttsRes.text()}`);
      const mp3Buf = await ttsRes.arrayBuffer();

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await audioCtx.decodeAudioData(mp3Buf.slice(0));
      const mono = mixToMono(decoded);
      setStatus(t("statusDone"));
      showResult(mono, decoded.sampleRate);
    } catch (e) {
      console.error(e);
      setStatus(e.message, true);
    } finally {
      if (voiceId && !$("keepVoice").checked) {
        try {
          await fetch(`https://api.elevenlabs.io/v1/voices/${voiceId}`, {
            method: "DELETE", headers: { "xi-api-key": key },
          });
        } catch (_) { /* not fatal */ }
      }
      $("runAi").disabled = false;
    }
  });

  // =======================================================================
  // shared: result display, waveform drawing, WAV export
  // =======================================================================

  function drawWave(canvas, mono) {
    const ctx = canvas.getContext("2d");
    const w = canvas.width = canvas.clientWidth * devicePixelRatio;
    const h = canvas.height = canvas.clientHeight * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#c9622f";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const step = Math.max(1, Math.floor(mono.length / w));
    for (let x = 0; x < w; x++) {
      let min = 1, max = -1;
      const start = x * step;
      for (let i = start; i < start + step && i < mono.length; i++) {
        if (mono[i] < min) min = mono[i];
        if (mono[i] > max) max = mono[i];
      }
      const yMin = (1 - (min * 0.9 + 1) / 2) * h;
      const yMax = (1 - (max * 0.9 + 1) / 2) * h;
      ctx.moveTo(x, yMin);
      ctx.lineTo(x, yMax);
    }
    ctx.stroke();
  }

  function encodeWav(samples, sr) {
    const bytesPerSample = 2;
    const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
    const view = new DataView(buffer);
    const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
    writeStr(0, "RIFF");
    view.setUint32(4, 36 + samples.length * bytesPerSample, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * bytesPerSample, true);
    view.setUint16(32, bytesPerSample, true);
    view.setUint16(34, 16, true);
    writeStr(36, "data");
    view.setUint32(40, samples.length * bytesPerSample, true);
    let off = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
    return new Blob([view], { type: "audio/wav" });
  }

  function showResult(outMono, outSr) {
    $("resultPanel").style.display = "block";
    drawWave($("waveOrig"), originalMono);
    drawWave($("waveOut"), outMono);

    const origBlob = encodeWav(originalMono, originalSr);
    $("audioOrig").src = URL.createObjectURL(origBlob);

    const outBlob = encodeWav(outMono, outSr);
    $("audioOut").src = URL.createObjectURL(outBlob);
    $("downloadLink").href = URL.createObjectURL(outBlob);

    $("resultPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
})();
</script>
